# =============================================================================
# AI Gateway Platform CI
# =============================================================================
# Product-owned pipeline. Named `platform-*` so it never collides with the
# upstream workflows in this directory, which are left untouched.
#
# Blocking vs non-blocking is deliberate. See the `frontend-lint` job for why
# oxlint is currently reported rather than enforced.
# =============================================================================

name: platform-ci

on:
  push:
    branches: [product/main, product/develop]
  pull_request:
    branches: [product/main, product/develop]
  workflow_dispatch:

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"

jobs:
  # ── Frontend must build first: the Go binary embeds web/dist ──────────────
  frontend:
    name: frontend build and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: web
        run: bun run typecheck

      - name: Build
        working-directory: web
        # Upstream ships an empty VERSION file (their release CI populates it),
        # so fall back to the pinned baseline tag rather than baking in "".
        run: |
          VERSION=$(cat ../VERSION 2>/dev/null || true)
          if [ -z "$VERSION" ]; then VERSION="v1.0.0-rc.22-platform"; fi
          echo "Building frontend version $VERSION"
          DISABLE_ESLINT_PLUGIN=true VITE_REACT_APP_VERSION="$VERSION" bun run build

      - name: Verify build output exists
        run: test -f web/dist/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  backend:
    name: backend build, vet and test
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # //go:embed web/dist fails to compile if the directory is absent, so the
      # real build output is restored rather than stubbed.
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Build
        run: go build -ldflags "-X 'github.com/QuantumNous/new-api/common.Version=${{ github.sha }}'" ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

  # ── Blocking: no NEW lint debt ───────────────────────────────────────────
  frontend-lint:
    name: frontend lint ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      # The fork inherited 468 oxlint violations (386 errors, 82 warnings) from
      # upstream v1.0.0-rc.22, recorded per file in web/.oxlint-baseline.json.
      #
      # Enforcing lint outright would redden every PR for inherited reasons;
      # disabling it would destroy the signal. So this is a ratchet: a file may
      # never exceed its recorded count, a file absent from the baseline must
      # be clean, and the total may never rise. Counts that fall are reported,
      # and `-Update` lowers the baseline.
      #
      # This job IS blocking. Verified on 2026-07-28 by adding a file with a
      # nested ternary: the guard failed with exit 1 and named the rule, and
      # `-Update` refused to raise the baseline.
      - name: Lint ratchet
        shell: pwsh
        run: pwsh ./scripts/lint-guard.ps1

  deploy-config:
    name: deployment config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Compose interpolates and validates at parse time, so a placeholder env
      # file is enough to catch syntax errors, bad references and typos in
      # required-variable names.
      - name: Validate dev compose
        run: |
          cp deploy/.env.example deploy/.env.dev
          sed -i 's/REPLACE_ME_[A-Z_]*/ci-placeholder-value/g' deploy/.env.dev
          docker compose --env-file deploy/.env.dev -f deploy/compose.dev.yaml config --quiet
          echo "dev compose OK"

      - name: Validate prod compose
        run: |
          cp deploy/.env.example deploy/.env.prod
          sed -i 's/REPLACE_ME_[A-Z_]*/ci-placeholder-value/g' deploy/.env.prod
          sed -i 's|^SESSION_COOKIE_TRUSTED_URL=.*|SESSION_COOKIE_TRUSTED_URL=https://ci.example.invalid|' deploy/.env.prod
          docker compose --env-file deploy/.env.prod -f deploy/compose.prod.yaml config --quiet
          echo "prod compose OK"

      - name: Validate nginx configuration
        run: |
          # Certificates are gitignored, so provide throwaway ones purely so
          # `nginx -t` can parse the ssl_certificate directives.
          mkdir -p deploy/nginx/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout deploy/nginx/certs/privkey.pem \
            -out deploy/nginx/certs/fullchain.pem \
            -subj "/CN=gateway.example.invalid" 2>/dev/null
          docker run --rm \
            -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/deploy/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "$PWD/deploy/nginx/certs:/etc/nginx/certs:ro" \
            nginx:1.27-alpine nginx -t

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cheap, targeted backstop against the specific mistakes this repo could
      # plausibly make: committing a real env file, a database dump, a private
      # key, or a live provider key.
      - name: Assert no secret files are tracked
        run: |
          set -e
          bad=$(git ls-files | grep -E '(^|/)\.env\.(dev|prod)$|\.dump$|\.pem$|\.key$|\.pfx$|credentials' || true)
          if [ -n "$bad" ]; then
            echo "Secret-bearing files are tracked:"
            echo "$bad"
            exit 1
          fi
          echo "no secret files tracked"

      - name: Assert no live keys in tracked content
        run: |
          set -e
          # Real provider keys, not the `sk-` prefix in docs or code.
          hits=$(git grep -nIE 'sk-[A-Za-z0-9]{32,}' -- . ':!*.md' || true)
          if [ -n "$hits" ]; then
            echo "Possible live API key committed:"
            echo "$hits"
            exit 1
          fi
          echo "no live key patterns found"

      - name: Assert env template has no real values
        run: |
          set -e
          if ! grep -q 'REPLACE_ME_POSTGRES_PASSWORD' deploy/.env.example; then
            echo "deploy/.env.example no longer contains placeholders - a real credential may have been committed"
            exit 1
          fi
          echo "env template still placeholder-only"

  # ── Launch blockers must keep blocking ───────────────────────────────────
  release-gate:
    name: release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Proves the production gate actually fires. The repository template has
      # no SOURCE_CODE_URL and marks pricing provisional, so a production
      # preflight MUST fail. If this ever passes, the gate has been weakened
      # and an unlicensed / wrongly-priced deploy just became possible.
      - name: Production preflight must refuse an unconfigured deploy
        shell: pwsh
        run: |
          cp deploy/.env.example deploy/.env.prod
          $out = pwsh ./scripts/preflight-release.ps1 -Environment prod 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -eq 0) {
            Write-Host "::error::preflight-release.ps1 passed with no source-code offer and provisional pricing. The launch gate is broken."
            exit 1
          }
          foreach ($needle in @('AGPL-13', 'PRICING')) {
            if ($out -notmatch $needle) {
              Write-Host "::error::expected blocker '$needle' was not reported"
              exit 1
            }
          }
          Write-Host "release gate correctly refused: AGPL-13 and PRICING blockers present"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Compliance unit tests
        run: go test ./setting/platform/ -count=1
