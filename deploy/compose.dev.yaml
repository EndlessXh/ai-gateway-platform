# =============================================================================
# AI Gateway Platform — LOCAL DEVELOPMENT stack
# =============================================================================
# Usage (always via the wrapper script, which validates the env file first):
#   pwsh ./scripts/dev-up.ps1
#
# Raw equivalent:
#   docker compose --env-file deploy/.env.dev -f deploy/compose.dev.yaml up -d
#
# Scope: this file owns the *backing services* (PostgreSQL 16 + Redis 7) that
# the natively-run Go backend and Rsbuild dev server connect to. The Go binary
# is NOT containerised in dev — rebuilding a Go image on every edit is far
# slower than `go run`, and the frontend needs Rsbuild HMR on the host.
# The containerised app is available behind the `app` profile for verifying
# the production image build locally.
#
# Isolation guarantees vs. the pre-existing ../new-api-infra stack:
#   - distinct project name  (ai-gateway-dev   vs new-api-dev)
#   - distinct volume names  (ai_gateway_dev_* vs new_api_dev_*)
#   - distinct host ports    (3001/5433/6380 vs 3000/15432/16379)
#
# Host ports must stay outside the Windows reserved ranges reported by
#   netsh interface ipv4 show excludedportrange protocol=tcp
# Hyper-V reserves large blocks (15334-15533 among them), and binding inside
# one fails with "access permissions" rather than "address in use".
# Nothing here can read or mutate the baseline stack's data.
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-ai-gateway-dev}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-security: &default-security
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    <<: *default-security
    image: "${POSTGRES_IMAGE:-postgres}:${POSTGRES_TAG:-16.8-alpine}"
    restart: unless-stopped
    networks: [private]
    # Published on loopback because the primary dev workflow runs the Go API
    # natively on the host (see scripts/dev-backend.ps1), which needs to reach
    # the database. Bound to 127.0.0.1 only — never a routable address.
    ports:
      - "127.0.0.1:${PLATFORM_POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    shm_size: 256mb

  redis:
    <<: *default-security
    image: "${REDIS_IMAGE:-redis}:${REDIS_TAG:-7.4.2-alpine}"
    restart: unless-stopped
    networks: [private]
    # Loopback-only, same rationale as postgres above.
    ports:
      - "127.0.0.1:${PLATFORM_REDIS_HOST_PORT:-6380}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Containerised application (profile: app) ───────────────────────────────
  # Used to verify the production image builds and boots. Day-to-day dev runs
  # the backend natively via ./scripts/dev-backend.ps1.
  app:
    <<: *default-security
    profiles: [app]
    build:
      context: ..
      dockerfile: Dockerfile
    image: "${PLATFORM_IMAGE:-ai-gateway-platform}:${PLATFORM_TAG:-dev}"
    restart: unless-stopped
    networks: [private, edge]
    ports:
      - "${PLATFORM_HTTP_HOST:-127.0.0.1}:${PLATFORM_HTTP_PORT:-3001}:3000"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PORT: "3000"
      GIN_MODE: ${GIN_MODE:-release}
      DEBUG: ${DEBUG:-false}
      ENABLE_PPROF: ${ENABLE_PPROF:-false}
      ERROR_LOG_ENABLED: ${ERROR_LOG_ENABLED:-false}
      TLS_INSECURE_SKIP_VERIFY: ${TLS_INSECURE_SKIP_VERIFY:-false}
      GENERATE_DEFAULT_TOKEN: ${GENERATE_DEFAULT_TOKEN:-false}
      STREAMING_TIMEOUT: ${STREAMING_TIMEOUT:-300}
      GLOBAL_API_RATE_LIMIT_ENABLE: ${GLOBAL_API_RATE_LIMIT_ENABLE:-true}
      GLOBAL_WEB_RATE_LIMIT_ENABLE: ${GLOBAL_WEB_RATE_LIMIT_ENABLE:-true}
      CRITICAL_RATE_LIMIT_ENABLE: ${CRITICAL_RATE_LIMIT_ENABLE:-true}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CRYPTO_SECRET: ${CRYPTO_SECRET:?CRYPTO_SECRET is required}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_TRUSTED_URL: ${SESSION_COOKIE_TRUSTED_URL:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-none}
      SQL_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD}@redis:6379/0
      MEMORY_CACHE_ENABLED: ${MEMORY_CACHE_ENABLED:-true}
      BATCH_UPDATE_ENABLED: ${BATCH_UPDATE_ENABLED:-true}
      BATCH_UPDATE_INTERVAL: ${BATCH_UPDATE_INTERVAL:-5}
      NODE_NAME: ${NODE_NAME:-ai-gateway-dev-local}
      NODE_TYPE: ${NODE_TYPE:-master}
      # Optional in development; required in production. See compose.prod.yaml.
      SOURCE_CODE_URL: ${SOURCE_CODE_URL:-}
      PLATFORM_BRAND_NAME: ${PLATFORM_BRAND_NAME:-HYC AI}
      LICENSE_NOTICE_URL: ${LICENSE_NOTICE_URL:-}
    volumes:
      - app_data:/data
      - app_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -q -O - http://localhost:3000/api/status | grep -q ''"success"''',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  # Development only. Unlike compose.prod.yaml this network is NOT `internal`,
  # because the dev database ports are published to 127.0.0.1 for host tooling
  # and the app container needs outbound access to upstream provider APIs.
  # Production keeps postgres/redis on an `internal: true` network with no
  # published ports at all — see deploy/compose.prod.yaml.
  private:
  edge:

volumes:
  postgres_data:
    name: ai_gateway_dev_postgres_data
  redis_data:
    name: ai_gateway_dev_redis_data
  app_data:
    name: ai_gateway_dev_app_data
  app_logs:
    name: ai_gateway_dev_app_logs
