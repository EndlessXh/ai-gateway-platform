# =============================================================================
# AI Gateway Platform — nginx main configuration (production edge)
# =============================================================================
# Mounted read-only at /etc/nginx/nginx.conf by deploy/compose.prod.yaml.
#
# Not deployed yet. Requires real certificates in deploy/nginx/certs/ and a
# real PLATFORM_PUBLIC_DOMAIN before it will serve anything.
# =============================================================================

user  nginx;
# `auto` matches the container's visible CPUs rather than the host's.
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $upstream_response_time and $request_time matter here: a gateway's
    # latency problems are almost always upstream provider latency, and
    # without these you cannot tell the two apart.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time';

    # NOTE: access logs must never record Authorization or X-Api-Key headers.
    # The format above deliberately omits them. Do not add $http_authorization.
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  75s;
    server_tokens   off;

    # Relay payloads carry base64 images and audio; 32 MB matches the app's
    # MAX_REQUEST_BODY_MB.
    client_max_body_size 32m;
    client_body_timeout  60s;
    client_header_timeout 60s;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml application/xml+rss text/javascript
                      image/svg+xml;
    # Never gzip SSE — buffering a compression window defeats streaming.

    # ── Rate limiting ────────────────────────────────────────────────────────
    # Keyed on client IP. The app enforces per-token limits itself; this is the
    # coarse edge defence against a single host hammering the service.
    limit_req_zone $binary_remote_addr zone=relay:10m  rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m    rate=10r/s;
    # Login, register, password reset, redemption: brute-force targets.
    limit_req_zone $binary_remote_addr zone=critical:10m rate=1r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    limit_conn_status 429;

    # ── TLS ──────────────────────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    include /etc/nginx/conf.d/*.conf;
}
