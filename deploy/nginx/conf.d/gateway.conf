# =============================================================================
# AI Gateway Platform — site configuration
# =============================================================================
# NOT DEPLOYED. Before first use:
#   1. replace gateway.example.invalid with the real hostname
#   2. place fullchain.pem / privkey.pem in deploy/nginx/certs/ (gitignored)
#   3. set TRUSTED_PROXIES in deploy/.env.prod to this container's subnet
#
# nginx does not expand environment variables in configuration files, so the
# hostname is written literally rather than as ${PLATFORM_PUBLIC_DOMAIN}.
# Keep it in sync with that variable.
#
# VALIDATION STATUS: this configuration has NOT been checked with `nginx -t`.
# The nginx image could not be pulled in the authoring environment (the Docker
# daemon has no route to any registry). The `deploy-config` job in
# .github/workflows/platform-ci.yml runs `nginx -t` against it; treat that job
# as the first real syntax check, and do not deploy this until it has passed.
# =============================================================================

upstream ai_gateway_app {
    # `app` resolves on the Compose `edge` network.
    server app:3000;
    keepalive 64;
}

# ── HTTP: redirect everything except ACME ────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name gateway.example.invalid;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gateway.example.invalid;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # ── Security headers ─────────────────────────────────────────────────────
    # HSTS: only safe once HTTPS is known good. preload is omitted on purpose —
    # it is effectively irreversible and should be an explicit later decision.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # The frontend is a bundled SPA. 'unsafe-inline' for styles is required by
    # Tailwind's runtime style injection; scripts do not need it.
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    limit_conn conn 64;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # ── Relay endpoints (SSE) ────────────────────────────────────────────────
    # Streaming completions. Buffering here would hold the whole response and
    # destroy token-by-token delivery, so it is disabled explicitly.
    location ~ ^/(v1|v1beta)/ {
        limit_req zone=relay burst=60 nodelay;

        proxy_pass http://ai_gateway_app;

        proxy_buffering     off;
        proxy_cache         off;
        proxy_set_header    X-Accel-Buffering no;
        add_header          X-Accel-Buffering no always;
        chunked_transfer_encoding on;

        # Long-running generations. Must exceed the app's STREAMING_TIMEOUT
        # (default 300s) or nginx cuts the stream before the app gives up.
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # ── Auth and other brute-forceable endpoints ─────────────────────────────
    location ~ ^/api/(user/login|user/register|user/reset|oauth|setup) {
        limit_req zone=critical burst=5 nodelay;

        proxy_pass http://ai_gateway_app;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }

    # ── Management API ───────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://ai_gateway_app;
        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;
    }

    # ── Static assets ────────────────────────────────────────────────────────
    # Rsbuild emits content-hashed filenames, so these are safe to cache hard.
    location /static/ {
        proxy_pass http://ai_gateway_app;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ── SPA and everything else ──────────────────────────────────────────────
    location / {
        proxy_pass http://ai_gateway_app;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }
}
