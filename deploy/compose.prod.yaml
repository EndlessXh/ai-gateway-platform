# =============================================================================
# AI Gateway Platform — PRODUCTION stack
# =============================================================================
#   docker compose --env-file deploy/.env.prod -f deploy/compose.prod.yaml up -d
#
# NOT READY TO DEPLOY AS-IS. Before first production use you must:
#   1. generate deploy/.env.prod with ./scripts/new-secrets.ps1 (no placeholders left)
#   2. place real certificates in deploy/nginx/certs/ (gitignored)
#   3. set PLATFORM_PUBLIC_DOMAIN and SESSION_COOKIE_TRUSTED_URL
#   4. build and pin PLATFORM_TAG to an immutable image tag + digest
#   5. set TRUSTED_PROXIES to the nginx subnet only
#
# Design notes:
#   - Only nginx publishes ports. app/postgres/redis are unreachable from the
#     host and from the internet; they sit on an `internal: true` network.
#   - Every credential is required with `${VAR:?}` so the stack refuses to
#     start with a missing or defaulted secret rather than booting insecurely.
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-ai-gateway-prod}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "10"

x-security: &default-security
  security_opt:
    - no-new-privileges:true

services:
  nginx:
    <<: *default-security
    image: "${NGINX_IMAGE:-nginx}:${NGINX_TAG:?NGINX_TAG is required}"
    restart: unless-stopped
    networks: [edge]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_cache:/var/cache/nginx
    environment:
      PLATFORM_PUBLIC_DOMAIN: ${PLATFORM_PUBLIC_DOMAIN:?PLATFORM_PUBLIC_DOMAIN is required}
      PLATFORM_TLS_CERT: ${PLATFORM_TLS_CERT:?PLATFORM_TLS_CERT is required}
      PLATFORM_TLS_KEY: ${PLATFORM_TLS_KEY:?PLATFORM_TLS_KEY is required}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      app:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  app:
    <<: *default-security
    # Immutable, pre-built image. Production never builds from source at deploy
    # time and never tracks a floating `latest` tag.
    image: "${PLATFORM_IMAGE:?PLATFORM_IMAGE is required}:${PLATFORM_TAG:?PLATFORM_TAG is required}"
    pull_policy: never
    restart: unless-stopped
    command: --log-dir /app/logs
    networks: [edge, private]
    # No `ports:` — reachable only through nginx.
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PORT: "3000"
      GIN_MODE: release
      DEBUG: "false"
      ENABLE_PPROF: "false"
      ERROR_LOG_ENABLED: "false"
      TLS_INSECURE_SKIP_VERIFY: "false"
      GENERATE_DEFAULT_TOKEN: "false"
      STREAMING_TIMEOUT: ${STREAMING_TIMEOUT:-300}
      GLOBAL_API_RATE_LIMIT_ENABLE: "true"
      GLOBAL_WEB_RATE_LIMIT_ENABLE: "true"
      CRITICAL_RATE_LIMIT_ENABLE: "true"
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CRYPTO_SECRET: ${CRYPTO_SECRET:?CRYPTO_SECRET is required}
      # HTTPS is terminated at nginx, so Secure cookies and strict origin
      # checking are mandatory here.
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_TRUSTED_URL: ${SESSION_COOKIE_TRUSTED_URL:?SESSION_COOKIE_TRUSTED_URL is required}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?TRUSTED_PROXIES is required}
      SQL_DSN: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD:?}@redis:6379/0
      MEMORY_CACHE_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      BATCH_UPDATE_INTERVAL: ${BATCH_UPDATE_INTERVAL:-5}
      NODE_NAME: ${NODE_NAME:?NODE_NAME is required}
      NODE_TYPE: ${NODE_TYPE:-master}
      # AGPLv3 section 13. Required in production: the stack refuses to start
      # without a source-code offer. See setting/platform/compliance.go and
      # docs/legal-and-source-offer.md.
      SOURCE_CODE_URL: ${SOURCE_CODE_URL:?SOURCE_CODE_URL is required in production (AGPLv3 section 13)}
      PLATFORM_BRAND_NAME: ${PLATFORM_BRAND_NAME:-HYC AI}
      LICENSE_NOTICE_URL: ${LICENSE_NOTICE_URL:-}
    volumes:
      - app_data:/data
      - app_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -q -O - http://localhost:3000/api/status | grep -q ''"success"''',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres:
    <<: *default-security
    image: "${POSTGRES_IMAGE:-postgres}:${POSTGRES_TAG:?POSTGRES_TAG is required}"
    restart: unless-stopped
    networks: [private]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    shm_size: 512mb

  redis:
    <<: *default-security
    image: "${REDIS_IMAGE:-redis}:${REDIS_TAG:?REDIS_TAG is required}"
    restart: unless-stopped
    networks: [private]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  edge:
  private:
    internal: true

volumes:
  postgres_data:
    name: ai_gateway_prod_postgres_data
  redis_data:
    name: ai_gateway_prod_redis_data
  app_data:
    name: ai_gateway_prod_app_data
  app_logs:
    name: ai_gateway_prod_app_logs
  nginx_cache:
    name: ai_gateway_prod_nginx_cache
